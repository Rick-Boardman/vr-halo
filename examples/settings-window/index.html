<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Halo — HUD settings window</title>
    <link rel="icon" href="data:," />

    <!--
      The import map points at THIS repo's node_modules rather than a CDN, so
      the example runs with no network — which is what lets the headless check
      (scripts/look-at-settings-window.mjs) drive it anywhere. three is named at the
      exact version package.json pins as a peer: one copy, one instance.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/": "/node_modules/three/",
          "troika-three-text": "/node_modules/troika-three-text/dist/troika-three-text.esm.js",
          "troika-three-utils": "/node_modules/troika-three-utils/dist/troika-three-utils.esm.js",
          "troika-worker-utils": "/node_modules/troika-worker-utils/dist/troika-worker-utils.esm.js",
          "webgl-sdf-generator": "/node_modules/webgl-sdf-generator/dist/webgl-sdf-generator.mjs",
          "bidi-js": "/node_modules/bidi-js/dist/bidi.mjs"
        }
      }
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #05070c;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: default;
      }
    </style>
  </head>

  <body>
    <canvas id="c"></canvas>
    <script type="module" src="./main.js"></script>
  </body>
</html>
